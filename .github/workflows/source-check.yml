name: Source and portable unit checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m compileall -q simple_video_studio
      - run: |
          python -m pip install --isolated --index-url https://pypi.org/simple --only-binary=:all: -r requirements.txt
      - run: python -m unittest discover -s simple_video_studio -p test_image_assets.py
      - run: python -m unittest discover -s simple_video_studio -p test_realism_controls.py
      - run: python -m unittest discover -s simple_video_studio -p test_portable_config.py
      - run: python -m unittest discover -s simple_video_studio -p test_engine_isolation.py
